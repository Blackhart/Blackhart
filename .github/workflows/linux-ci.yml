name: Linux CI

on:
  push:
    branches:
      - develop
      - 'feature/*'
      - 'fix/*'
  pull_request:
    branches:
      - develop
      - 'feature/*'
      - 'fix/*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            make \
            libgl1-mesa-dev \
            libopengl-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libomp-dev

      - name: Configure (Debug)
        run: cmake --preset debug

      - name: Build (Debug)
        run: cmake --build --preset debug -j"$(nproc)"

      - name: Test
        run: ctest --preset debug --output-on-failure
