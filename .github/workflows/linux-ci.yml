name: Linux CI

on:
  push:
    branches:
      - develop
      - 'feature/*'
      - 'fix/*'
  pull_request:
    branches:
      - develop
      - 'feature/*'
      - 'fix/*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CI image
        run: docker build -t blackhart-ci:local -f docker/ci/Dockerfile docker/ci

      - name: Configure (Debug)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            blackhart-ci:local \
            cmake --preset docker-debug

      - name: Build (Debug)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            blackhart-ci:local \
            cmake --build --preset docker-debug -j"$(nproc)"

      - name: Test
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            blackhart-ci:local \
            ctest --preset docker-debug --output-on-failure
